  if(!ME){openSheet(shd('👤 My account')+'<div class="card"><p class="small mut" style="margin-top:0">Enter your mobile number to see your saved cart, wishlist and past orders on any phone. No password needed.</p><label style="margin-top:0">Mobile number</label><input id="acm" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" autocomplete="tel"><div id="acerr" class="err"></div><button class="btn" style="margin-top:8px" id="acgo" onclick="accLogin()">Continue</button></div>');return}
  tab=tab||'o';
  var tabs=[['o','📦 Orders'],['w','♥ Wishlist'],['c','🛒 Cart']];
  var h=shd('👤 +91 '+H(ME))+'<div style="display:flex;gap:6px;margin-bottom:10px">'+tabs.map(function(t){return '<button class="btn sm'+(t[0]===tab?'':' out')+'" onclick="openAccount(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</div>';
  if(tab==='o'){var os=ACC.ord||[];
    h+=os.length?os.map(function(o){return '<div class="card" style="margin-bottom:8px;cursor:pointer" onclick="closeSheet();go(\'t='+H(o.id)+'\')"><div class="row"><b>'+H(o.no)+'</b><b>'+R(o.total)+'</b></div><div class="mut small">'+H(String(o.at||'').slice(0,10))+' · '+H((o.it||[]).map(function(i){return i.n+' ×'+i.q}).join(', ')).slice(0,120)+'</div><div class="small" style="color:var(--pri2);font-weight:700;margin-top:4px">Track order ›</div></div>'}).join(''):'<div class="card mut" style="text-align:center">No orders yet.</div>'}
  else if(tab==='w'){var ids=Object.keys(WL).filter(function(i){return PRODS[i]||CP[i]});
    h+=ids.length?ids.map(function(i){var p=PRODS[i];return p?'<div class="card" style="margin-bottom:8px"><div class="row"><b>'+H(p.n)+'</b><b>'+(p.t==='m'?'':R(unitP(p,1)))+'</b></div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn sm" onclick="closeSheet();go(\'p='+H(i)+'\')">View</button>'+(p.t!=='m'&&inStock(p)?'<button class="btn sm out" onclick="chg(\''+H(i)+'\',1);openAccount(\'w\')">Add to cart</button>':'')+'<button class="btn sm out" style="width:auto" onclick="ttWish(\''+H(i)+'\');openAccount(\'w\')">✕</button></div></div>':''}).join(''):'<div class="card mut" style="text-align:center">Tap ♥ on any product to save it here.</div>'}
  else{var n=Object.keys(CART).length;h+=n?'<div class="card">'+Object.keys(CART).map(function(k){return PRODS[k]?'<div class="row"><span>'+H(PRODS[k].n)+' × '+CART[k]+'</span></div>':''}).join('')+'<button class="btn" style="margin-top:8px" onclick="openCart()">Open cart</button></div>':'<div class="card mut" style="text-align:center">Your cart is empty.</div>'}
  h+='<button class="btn out sm" style="margin-top:10px" onclick="accOut()">Not you? Use another number</button>';
  openSheet(h);
};
window.accLogin=function(){
  var m=val('acm').replace(/\D/g,'');if(!/^[6-9]\d{9}$/.test(m)){$('acerr').textContent='Enter a valid 10-digit mobile number';return}
  var b=$('acgo');b.disabled=true;b.textContent='Please wait…';
  accBusy=true;accGet(m).then(function(c){accUse(m,c);accBusy=false;accPut();openAccount('o')}).catch(function(){accBusy=false;b.disabled=false;b.textContent='Continue';$('acerr').textContent='Could not connect. Check your internet and try again.'});
};
window.accOut=function(){ME='';ls('TTS_ME','');ACC={ord:[]};openAccount()};

window.PRODS=PRODS;
load();
})();
