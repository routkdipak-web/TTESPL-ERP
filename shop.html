/* ---------- checkout ---------- */
var FORM=ls('TTS_PROFILE')||{};
function saveProfile(){try{var f=FORM;ls('TTS_PROFILE',{name:f.name||'',phone:f.phone||'',email:f.email||'',addr:f.addr||'',city:f.city||'',pin:f.pin||'',state:f.state||'',gst:f.gst||''})}catch(e){}}
window.clearProfile=function(){FORM={};try{localStorage.removeItem('TTS_PROFILE')}catch(e){}checkout()};
function checkout(){
  var qt=quote();if(!qt.rows.length)return;var f=FORM,odi=CFG.area!=='india'||ST.area==='odisha';
  var h=shd('📍 Delivery details')+(f.name&&f.addr?'<div class="note" style="color:var(--ok);border-color:var(--ok);background:rgba(5,150,105,.1)">👋 Welcome back, '+H(String(f.name).split(" ")[0])+'! Your saved details are filled in. <a href="#" onclick="clearProfile();return false">Not you? Clear</a></div>':'')+'<div class="card"><input class="hp" id="web" tabindex="-1" autocomplete="off">'+
   '<label style="margin-top:0">Full name *</label><input id="f_name" value="'+H(f.name||'')+'" autocomplete="name">'+
   '<label>Mobile number * (we will call to confirm)</label><input id="f_phone" type="tel" inputmode="numeric" maxlength="10" value="'+H(f.phone||'')+'" autocomplete="tel">'+
   '<label>Email (optional)</label><input id="f_email" type="email" value="'+H(f.email||'')+'" autocomplete="email">'+
   '<label>Address * (house, street, landmark)</label><textarea id="f_addr" rows="2" autocomplete="street-address">'+H(f.addr||'')+'</textarea>'+
   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>City *</label><input id="f_city" value="'+H(f.city||'')+'"></div><div><label>PIN code *</label><input id="f_pin" inputmode="numeric" maxlength="6" value="'+H(f.pin||'')+'"></div></div>'+
   '<label>State</label>'+(odi?'<input id="f_state" value="Odisha" readonly>':'<input id="f_state" value="'+H(f.state||'')+'" placeholder="State">')+
   '<label>GSTIN (optional – for a GST invoice)</label><input id="f_gst" maxlength="15" style="text-transform:uppercase" value="'+H(f.gst||'')+'">'+
   '<label>Note (optional)</label><input id="f_note" value="'+H(f.note||'')+'" placeholder="Any instruction for us"></div>'+
   '<div id="ferr" class="err"></div><button class="btn" onclick="toPay()">Continue to payment • '+R(qt.total)+'</button><button class="back" onclick="openCart()" style="margin-top:6px">‹ Back to cart</button>';
  openSheet(h);
}
window.checkout=checkout;
function val(id){return ($(id)?$(id).value:'').trim()}
window.toPay=function(){
  var f={name:val('f_name'),phone:val('f_phone').replace(/\D/g,''),email:val('f_email'),addr:val('f_addr'),city:val('f_city'),pin:val('f_pin').replace(/\D/g,''),state:val('f_state'),gst:val('f_gst').toUpperCase(),note:val('f_note')},e='';
  FORM=f;var odi=CFG.area!=='india'||ST.area==='odisha';
  if(f.name.length<2)e='Please enter your name';
  else if(!/^[6-9]\d{9}$/.test(f.phone))e='Enter a valid 10-digit mobile number';
  else if(f.addr.length<8)e='Please enter your full address';
  else if(f.city.length<2)e='Please enter your city';
  else if(!/^\d{6}$/.test(f.pin))e='Enter a valid 6-digit PIN code';
  else if(odi&&!/^(75|76|77)/.test(f.pin))e='This PIN is not in Odisha. '+(CFG.area==='india'?'Choose "Rest of India" delivery in your cart.':'We currently deliver within Odisha only.');
  else if(!odi&&f.state.length<2)e='Please enter your state';
  else if(f.gst&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/.test(f.gst))e='GSTIN looks incorrect – leave it blank if unsure';
  if(e){$('ferr').textContent=e;return}
  if($('web')&&$('web').value)return;
  payStep();
};
function upiUrl(amt,ref){var u=CFG.upi||{pa:'eazypay.574099310@icici',pn:'TWINTOWN EXPRESS SERVICES'};return 'upi://pay?pa='+u.pa+'&pn='+encodeURIComponent(u.pn)+'&am='+Number(amt).toFixed(2)+'&cu=INR&tn='+encodeURIComponent(ref)}
var OID='';
function newId(){var a='abcdefghijklmnopqrstuvwxyz0123456789',s='';for(var i=0;i<14;i++)s+=a[Math.floor(Math.random()*a.length)];return 'S'+Date.now().toString(36)+s}
function payStep(){
  var qt=quote();if(!OID)OID=newId();var no=orderNo(OID);
  var h=shd('💳 Payment')+'<div class="card" style="text-align:center"><div class="mut">Amount to pay</div><div style="font-size:30px;font-weight:800">'+R(qt.total)+'</div>'+
   '<div style="display:flex;gap:8px;margin:10px 0"><button class="chip'+(ST.pay==='upi'?' on':'')+'" style="flex:1" onclick="setPay(\'upi\')">Pay by UPI now</button><button class="chip'+(ST.pay==='call'?' on':'')+'" style="flex:1" onclick="setPay(\'call\')">Confirm by call</button></div>';
  if(ST.pay==='upi'){
    h+='<a class="btn" href="'+H(upiUrl(qt.total,no))+'">Open UPI app & pay</a><div id="qr"></div><div class="mut small">Or scan with any UPI app · UPI ID: <b>'+H((CFG.upi||{pa:'eazypay.574099310@icici'}).pa)+'</b></div>'+
     '<div style="text-align:left"><label>After paying, enter the UTR / reference number *</label><input id="utr" placeholder="12-digit UTR from your UPI app" maxlength="30" style="text-transform:uppercase"><div class="mut small" style="margin-top:4px">We verify it with our bank and then confirm your order.</div></div>';
  }else h+='<div class="note" style="text-align:left">No payment now. Our team will call you to confirm the order and share payment details.</div>';
  h+='</div><div id="perr" class="err"></div><button class="btn ok" id="placeBtn" onclick="place()">✅ Place order</button><button class="back" onclick="checkout()" style="margin-top:6px">‹ Back</button>';
  openSheet(h);
  if(ST.pay==='upi')try{var el=$('qr');if(typeof qrcode==='function'){var c=qrcode(0,'M');c.addData(upiUrl(qt.total,no));c.make();el.innerHTML=c.createSvgTag({cellSize:5,margin:1,scalable:true})}else el.style.display='none'}catch(e){$('qr').style.display='none'}
}
window.setPay=function(v){ST.pay=v;payStep()};
function orderNo(id){var d=new Date(),p=function(n){return ('0'+n).slice(-2)};return 'SO-'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+id.slice(-4).toUpperCase()}
window.place=function(){
  var qt=quote(),utr=ST.pay==='upi'?val('utr').toUpperCase().replace(/[^A-Z0-9]/g,''):'';
  if(CFG.open===false)return perr('Store is closed right now');
  if(ST.pay==='upi'&&utr.length<6)return perr('Please enter the UTR / reference number after paying');
  if(Date.now()-T0<4000)return perr('Please wait a moment and try again');
  var hist=ls('TTS_ORD')||[],hr=hist.filter(function(o){return Date.now()-o.ts<3600000}).length;if(hr>=5)return perr('Too many orders from this phone. Please call us.');
  var btn=$('placeBtn');btn.disabled=true;btn.textContent='Placing order…';
  var items=qt.rows.map(function(r){return {pid:r.pid,n:r.n,q:r.q,u:r.u,t:r.t}});
  var f=FORM,no=orderNo(OID),o={id:OID,no:no,name:f.name,phone:f.phone,email:f.email||'',addr:f.addr,city:f.city,pin:f.pin,state:f.state||'Odisha',gst:f.gst||'',area:ST.area,note:f.note||'',pay:ST.pay,utr:utr,ij:JSON.stringify(items),sub:qt.sub,cdisc:qt.cdisc,coupon:qt.coupon,ship:qt.ship,total:qt.total,at:new Date().toISOString(),status:'new'};
  fsCreate('shop_orders',OID,o).then(function(){
    saveProfile();
    hist.unshift({id:OID,no:no,total:qt.total,ts:Date.now(),name:f.name,pay:ST.pay,utr:utr,it:items.map(function(i){return {n:i.n,q:i.q,t:i.t}}),cd:qt.cdisc,sh:qt.ship});ls('TTS_ORD',hist.slice(0,30));
    CART={};saveCart();ST.coupon='';var oid=OID;OID='';
    var link=location.origin+location.pathname+'?t='+oid;
    var wa=(CFG.wa||'').replace(/\D/g,'');var msg='Hello TTESPL, I placed online order '+no+' of '+R(qt.total)+'.'+(utr?' UTR: '+utr:'')+'\n'+link;
    openSheet(shd('Order placed')+'<div class="card ok-box"><div class="tick">✅</div><h2>Thank you, '+H(f.name.split(' ')[0])+'!</h2><div>Your order number</div><div style="font-size:22px;font-weight:800;letter-spacing:.5px">'+H(no)+'</div><p class="mut small">'+(ST.pay==='upi'?'We will verify your payment (UTR '+H(utr)+') and confirm the order shortly.':'Our team will call you on '+H(f.phone)+' to confirm.')+'</p></div>'+
      '<button class="btn" onclick="closeSheet();go(\'t='+oid+'\')">📦 Track my order</button>'+(wa.length>=10?'<a class="btn wa" style="margin-top:8px" target="_blank" rel="noopener" href="https://wa.me/'+(wa.length===10?'91'+wa:wa)+'?text='+encodeURIComponent(msg)+'">Send order on WhatsApp</a>':'')+'<button class="btn out" style="margin-top:8px" onclick="closeSheet();go(\'\')">Continue shopping</button>');
  }).catch(function(){btn.disabled=false;btn.textContent='✅ Place order';perr('Could not send the order. Check your internet and try again.')});
};
function perr(t){var e=$('perr');if(e)e.textContent=t}

/* ---------- machine enquiry ---------- */
window.enquiry=function(id){
  var p=PRODS[id]||{n:''};
  openSheet(shd('📝 Get a quote')+'<div class="card"><b>'+H(p.n)+'</b><input class="hp" id="web2" tabindex="-1" autocomplete="off">'+
   '<label>Your name *</label><input id="e_name" autocomplete="name" value="'+H(FORM.name||'')+'"><label>Mobile number *</label><input id="e_phone" type="tel" inputmode="numeric" maxlength="10" value="'+H(FORM.phone||'')+'"><label>City</label><input id="e_city" value="'+H(FORM.city||'')+'"><label>What do you need? (optional)</label><textarea id="e_msg" rows="3" placeholder="e.g. need for my car wash centre, budget, quantity"></textarea></div><div id="eerr" class="err"></div><button class="btn" id="eBtn" onclick="sendEnq(\''+H(id)+'\')">Send enquiry</button>');
};
window.sendEnq=function(id){
  var p=PRODS[id]||{n:''},name=val('e_name'),ph=val('e_phone').replace(/\D/g,''),e='';
  if(name.length<2)e='Please enter your name';else if(!/^[6-9]\d{9}$/.test(ph))e='Enter a valid 10-digit mobile number';
  if(e){$('eerr').textContent=e;return}if($('web2')&&$('web2').value)return;
  var hist=ls('TTS_ENQ')||[];if(hist.filter(function(t){return Date.now()-t<3600000}).length>=5){$('eerr').textContent='Too many enquiries. Please call us.';return}
  var b=$('eBtn');b.disabled=true;b.textContent='Sending…';
  var eid=newId();
  fsCreate('shop_enquiries',eid,{id:eid,pid:String(id),pn:String(p.n).slice(0,120),name:name.slice(0,80),phone:ph,city:val('e_city').slice(0,60),msg:val('e_msg').slice(0,400),at:new Date().toISOString(),status:'new'}).then(function(){
    hist.unshift(Date.now());ls('TTS_ENQ',hist.slice(0,20));FORM.name=FORM.name||name;FORM.phone=FORM.phone||ph;FORM.city=FORM.city||val('e_city');saveProfile();
    openSheet(shd('Enquiry sent')+'<div class="card ok-box"><div class="tick">✅</div><h2>Thank you!</h2><p class="mut">Our team will call you on '+H(ph)+' with the best quote for <b>'+H(p.n)+'</b>.</p></div><button class="btn" onclick="closeSheet()">Done</button>');
  }).catch(function(){b.disabled=false;b.textContent='Send enquiry';$('eerr').textContent='Could not send. Check your internet and try again.'});
};

/* ---------- order tracking ---------- */
window.openTrack=function(){
  var l=ls('TTS_ORD')||[];
  openSheet(shd('📦 Track your order')+(l.length?'<div class="card">'+l.map(function(o){return '<div class="row" style="cursor:pointer" onclick="closeSheet();go(\'t='+H(o.id)+'\')"><span><b>'+H(o.no)+'</b><br><small class="mut">'+new Date(o.ts).toLocaleDateString('en-IN')+'</small></span><b>'+R(o.total)+' ›</b></div>'}).join('<div class="hr"></div>')+'</div>':'<div class="card mut" style="text-align:center">No orders from this phone yet. Open the tracking link we sent you to see an order.</div>'));
};
var STEPS=[['new','Placed'],['confirmed','Confirmed'],['packed','Packed'],['shipped','Shipped'],['delivered','Delivered']];
function trackPage(id){
  id=id.replace(/[^a-z0-9]/gi,'');app.innerHTML='<div class="card mut" style="text-align:center">Loading order…</div>';
  seo('Track your order | TTESPL','Track your TTESPL order',null);
  fsGet('shop_track/'+id).then(function(d){var t=jf(d);if(!t)throw new Error('gone');
    var idx=Math.max(0,STEPS.map(function(s){return s[0]}).indexOf(t.st)),canc=t.st==='cancelled';
    var h='<button class="back" onclick="go(\'\')">‹ Store</button><div class="card"><h2>Order '+H(t.no)+'</h2><div class="mut small">Placed '+H(String(t.at||'').slice(0,10))+' · '+H(t.name||'')+'</div>'+
     (canc?'<div class="closed" style="margin-top:10px">This order was cancelled.'+(t.note?'<br>'+H(t.note):'')+'</div>':'<div class="steps">'+STEPS.map(function(s,i){return '<i class="'+(i<=idx?'on':'')+'">'+s[1]+'</i>'}).join('')+'</div>'+(t.note?'<div class="note">'+H(t.note)+'</div>':''))+'</div>'+
     '<div class="card"><h3>Items</h3>'+(t.it||[]).map(function(i){return '<div class="row"><span>'+H(i.n)+' × '+H(i.q)+'</span><b>'+R(i.t)+'</b></div>'}).join('')+'<div class="hr"></div>'+(N(t.cd)>0?'<div class="row"><span>Coupon</span><b>− '+R(t.cd)+'</b></div>':'')+'<div class="row"><span>Delivery</span><b>'+(N(t.sh)>0?R(t.sh):'FREE')+'</b></div><div class="row" style="font-size:17px"><b>Total</b><b>'+R(t.total)+'</b></div>'+
     '<div class="row"><span>Payment</span><b>'+(t.paid?'✅ Received':(t.pay==='upi'?'⏳ Verifying':'On confirmation'))+'</b></div></div>';
    var wa=(CFG.wa||'').replace(/\D/g,'');if(wa.length>=10)h+='<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+(wa.length===10?'91'+wa:wa)+'?text='+encodeURIComponent('Hello, about my order '+t.no)+'">💬 Chat with us about this order</a>';
    app.innerHTML=h;
  }).catch(function(){
    var mine=(ls('TTS_ORD')||[]).filter(function(o){return o.id===id})[0];
    if(!mine){app.innerHTML='<div class="card" style="text-align:center"><h2>Order not found</h2><p class="mut">Please check the link or contact us.</p><button class="btn" onclick="go(\'\')">Back to store</button></div>';return}
    var wa=(CFG.wa||'').replace(/\D/g,'');
    app.innerHTML='<button class="back" onclick="go(\'\')">‹ Store</button><div class="card ok-box"><div class="tick">✅</div><h2>Your order has been placed successfully</h2><div class="mut small">Order '+H(mine.no)+' · '+new Date(mine.ts).toLocaleDateString('en-IN')+'</div>'+
      '<div class="note" style="text-align:left">⏳ Please wait for confirmation from the seller. Once your order is confirmed, its tracking details will appear on this page.'+(mine.pay==='upi'?' We will also verify your payment (UTR '+H(mine.utr)+').':'')+'</div></div>'+
      (mine.it?'<div class="card"><h3>Items</h3>'+mine.it.map(function(i){return '<div class="row"><span>'+H(i.n)+' × '+H(i.q)+'</span><b>'+R(i.t)+'</b></div>'}).join('')+'<div class="hr"></div>'+(N(mine.cd)>0?'<div class="row"><span>Coupon</span><b>− '+R(mine.cd)+'</b></div>':'')+'<div class="row"><span>Delivery</span><b>'+(N(mine.sh)>0?R(mine.sh):'FREE')+'</b></div><div class="row" style="font-size:17px"><b>Total</b><b>'+R(mine.total)+'</b></div></div>':'')+
      (wa.length>=10?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+(wa.length===10?'91'+wa:wa)+'?text='+encodeURIComponent('Hello, I placed order '+mine.no+'. Please confirm.')+'">💬 Chat with us about this order</a>':'')+
      '<button class="btn out" style="margin-top:8px" onclick="trackPage(\''+id+'\')">🔄 Check status again</button>';
    clearTimeout(window.__trk);window.__trk=setTimeout(function(){if(new URLSearchParams(location.search).get('t')===id)trackPage(id)},30000);
  });
}
window.trackPage=trackPage;

load();
})();
</script>
</body>
</html>
