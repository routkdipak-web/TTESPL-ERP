name: Deploy to Firebase Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI & Dependencies
        run: |
          npm install -g firebase-tools
          cd functions
          npm install

      - name: Deploy to Firebase Functions
        run: firebase deploy --only functions --project TTESPL-ERP
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
